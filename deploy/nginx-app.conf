server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25M;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # GZIP
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Frontend SPA ──────────────────────────────────────────────
    root /var/www/html/frontend;
    index index.html;

    # A company address opens the app (login). Apex and www stay on the marketing page.
    location = / {
        if ($host ~* "^(?!www\.)[a-z0-9]+\.accounts360techx\.com$") {
            rewrite ^ /app.html last;
        }
        try_files /index.html =404;
    }

    location = /index.html {
        if ($host ~* "^(?!www\.)[a-z0-9]+\.accounts360techx\.com$") {
            rewrite ^ /app.html last;
        }
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API ───────────────────────────────────────────────
    # Named location keeps the PDF/picture body on the way to PHP.
    location /backend/public/ {
        root /var/www/html;
        try_files $uri $uri/ @accounts_api;
    }

    location @accounts_api {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /backend/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 120s;
        fastcgi_request_buffering on;
    }

    location ~ ^/backend/public/.+\.php$ {
        root /var/www/html;
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_read_timeout 120s;
    }

    # Block sensitive files
    location ~ /\.(env|sql|git) {
        deny all;
        return 404;
    }

    # Static assets — long cache
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;
}
